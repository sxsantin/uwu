<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeApi</title>

<style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#1e1e2f;
      color:white;
      padding:20px;
    }

    h1{
      text-align:center;
      margin-bottom:30px;
      font-size:40px;
    }

    .contenedor{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
      gap:20px;
    }

    .card{
      background:#2c2c44;
      border-radius:20px;
      padding:20px;
      text-align:center;
      box-shadow:0 0 15px rgba(0,0,0,0.3);
      transition:0.3s;
    }

    .card:hover{
      transform:scale(1.03);
    }

    .card img{
      width:150px;
      height:150px;
      object-fit:contain;
    }

    .nombre{
      font-size:25px;
      margin:10px 0;
      text-transform:capitalize;
    }

    .tipo{
      display:inline-block;
      background:#ffcb05;
      color:black;
      padding:5px 10px;
      border-radius:20px;
      margin:5px;
      font-weight:bold;
    }

    .stat{
      margin-top:8px;
      text-align:left;
    }

    .bar{
      width:100%;
      height:18px;
      background:#555;
      border-radius:20px;
      overflow:hidden;
    }

    .fill{
      height:100%;
      background:#4caf50;
      color:white;
      font-size:12px;
      text-align:right;
      padding-right:5px;
      line-height:18px;
    }

    .buscador{
      width:100%;
      max-width:400px;
      margin:0 auto 30px auto;
      display:block;
      padding:12px;
      border:none;
      border-radius:10px;
      font-size:18px;
    }

  </style>

</head>
<body>
    
    
    <h1>Pokédex</h1>

    <input type="text" id="buscador" class="buscador" placeholder="Buscar por nombre o ID...">

    <div class="contenedor" id="contenedor"></div>

    <script>

        const contenedor = document.getElementById('contenedor');
        const buscador = document.getElementById('buscador');   

        let todosPokemons = [];


        async function obtenerPokemons() {
            
            const url = 'https://pokeapi.co/api/v2/pokemon?limit=250';  

            const respuesta = await fetch(url);
            const datos = await respuesta.json();


            todosPokemons = datos.results;

            mostrarPokemons(todosPokemons);
        }

        //mostrar pokemons

        async function mostrarPokemons(pokemons) {

            contenedor.innerHTML = '';

            for (const pokemon of pokemons) {

                const respuesta = await fetch(pokemon.url);
                const datos = await respuesta.json();

                const card = document.createElement('div');
                card.classList.add('card');

                //tipos
                let tiposHTML = '';

                datos.types.forEach(tipo => { 
                    
                    tiposHTML += `
                    <span class="tipo">
                        ${tipo.type.name}
                        </span>`;
                });

                //stats
                let statsHTML = '';

                datos.stats.forEach(stat => {
                   
                    statsHTML += `
                    <div class="stat">
                        <strong>${stat.stat.name}:</strong>
                        <div class="bar">
                            <div class="fill">
                                ${stat.base_stat}
                            </div>
                        </div>
                    </div>`;
                });

                card.innerHTML = `
                    <img src="${datos.sprites.front_default}" alt="${datos.name}">
                     <h2 class="nombre">${datos.name}</h2>

                     <p><strong>ID:</strong> ${datos.id}</p>
                     <p><strong>Altura:</strong> ${datos.height}</p>
                     <p><strong>Peso:</strong> ${datos.weight}</p>
                     
                    <div class="tipos">${tiposHTML}</div>

                    <h3 style="margin-top:15px;">Stats</h3>

                    ${statsHTML}
                `;
            
                contenedor.appendChild(card);
                }
            }
        

            //buscador
            buscador.addEventListener('input', () => {
                
                const texto = buscador.value.toLowerCase();

                const filtrados = todosPokemons.filter(pokemon => 
                    pokemon.name.includes(texto) 
                );

                mostrarPokemons(filtrados);
            });

            obtenerPokemons();

    </script>

</body>
</html>
